name: Reproduction

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  paper-subset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install --upgrade "poetry==2.4.3"

      - name: Install benchmark dependencies
        run: poetry install --with benchmark

      - name: Run Experiment I subset
        run: poetry run python benchmarks/reproduce_paper_subset.py
